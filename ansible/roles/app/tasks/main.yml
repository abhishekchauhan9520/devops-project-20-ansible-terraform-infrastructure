---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  notify: Reload nginx

- name: Ensure application directory exists
  ansible.builtin.file:
    path: /var/www/myapp
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy application page
  ansible.builtin.copy:
    dest: /var/www/myapp/index.html
    content: |
      <!doctype html>
      <html lang="en">
      <head><meta charset="utf-8"><title>Terraform + Ansible</title></head>
      <body><h1>Deployed via Terraform + Ansible</h1></body>
      </html>
    owner: www-data
    group: www-data
    mode: '0644'

- name: Configure nginx virtual host
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/myapp
    content: |
      server {
        listen 80 default_server;
        server_name _;
        root /var/www/myapp;
        index index.html;
      }
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/nginx -t -c %s'
  notify: Reload nginx

- name: Enable application site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/myapp
    dest: /etc/nginx/sites-enabled/myapp
    state: link
  notify: Reload nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
